<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Напоминания">
  <meta name="theme-color" content="#f2f2f7">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Напоминания и Лекарства</title>
</head>
<body>

  <!-- ================= ЭКРАН 1: ГЛАВНАЯ ================= -->
  <div id="screen-home" class="screen active">
    <header>
      <h1>Напоминания</h1>
    </header>

    <main>
      <button class="big-btn blue" onclick="открытьФормуНапоминания()">
        <span class="icon">🔔</span>
        <span class="label">Создание напоминания</span>
        <span class="arrow">›</span>
      </button>

      <button class="big-btn green" onclick="перейти('screen-tracker')">
        <span class="icon">💊</span>
        <span class="label">Создать трекер лекарств</span>
        <span class="arrow">›</span>
      </button>

      <div id="список-ближайших"></div>
    </main>
  </div>

  <!-- ================= ЭКРАН 2: ФОРМА НАПОМИНАНИЯ ================= -->
  <div id="screen-form" class="screen">
    <header>
      <button class="back" onclick="перейти('screen-home')">‹ Назад</button>
      <h1>Новое напоминание</h1>
      <button class="save" onclick="сохранитьНапоминание()">Готово</button>
    </header>

    <main>
      <div class="field">
        <textarea id="текст" placeholder="О чём напомнить?" rows="2"></textarea>
      </div>

      <label class="section-title">Быстрый интервал</label>
      <div class="intervals">
        <button class="interval" data-мин="30">30 мин</button>
        <button class="interval" data-мин="80">80 мин</button>
        <button class="interval active" data-мин="60">1 час</button>
        <button class="interval" data-мин="1440">1 день</button>
      </div>

      <button class="row-btn" onclick="показатьЧасы()">
        <span>🕐</span>
        <span>Часы — дата и время</span>
        <span id="выбранное-время" class="muted"></span>
      </button>
      <div id="блок-часов" class="hidden">
        <input type="date" id="дата">
        <input type="time" id="время">
      </div>

      <button class="row-btn" onclick="document.getElementById('фото').click()">
        <span>📷</span>
        <span>Прикрепить фото</span>
        <span id="фото-метка" class="muted"></span>
      </button>
      <input type="file" id="фото" accept="image/*" hidden>

      <button class="row-btn" onclick="document.getElementById('документ').click()">
        <span>📄</span>
        <span>Прикрепить документ</span>
        <span id="док-метка" class="muted"></span>
      </button>
      <input type="file" id="документ" hidden>

      <label class="row-btn">
        <span>❗️</span>
        <span>Очень важное</span>
        <input type="checkbox" id="важное" class="toggle">
      </label>

      <button class="row-btn red" onclick="удалитьНапоминание()">
        <span>🗑</span>
        <span>Удалить</span>
      </button>
    </main>
  </div>

  <!-- ================= ЭКРАН 3: ТРЕКЕР ЛЕКАРСТВ ================= -->
  <div id="screen-tracker" class="screen">
    <header>
      <button class="back" onclick="перейти('screen-home')">‹ Назад</button>
      <h1>Трекер лекарств</h1>
      <button class="save" onclick="открытьФормуЛекарства()">+</button>
    </header>

    <main>
      <!-- Навигация по неделям -->
      <div class="week-nav">
        <button class="week-btn" onclick="сменитьНеделю(-1)">‹</button>
        <button class="week-title" onclick="сброситьНеделю()">
          <span id="название-недели">Текущая неделя</span>
          <span id="диапазон-недели" class="week-range"></span>
        </button>
        <button class="week-btn" onclick="сменитьНеделю(1)">›</button>
      </div>

      <div class="table-wrap">
        <table id="таблица-лекарств">
          <thead>
            <tr id="шапка-таблицы">
              <th></th>
              <th data-day="1">Пн</th>
              <th data-day="2">Вт</th>
              <th data-day="3">Ср</th>
              <th data-day="4">Чт</th>
              <th data-day="5">Пт</th>
              <th data-day="6">Сб</th>
              <th data-day="7">Вс</th>
            </tr>
          </thead>
          <tbody>
            <tr><td class="row-label">Утро</td>
              <td data-day="1" data-time="утро"></td><td data-day="2" data-time="утро"></td><td data-day="3" data-time="утро"></td><td data-day="4" data-time="утро"></td><td data-day="5" data-time="утро"></td><td data-day="6" data-time="утро"></td><td data-day="7" data-time="утро"></td></tr>
            <tr><td class="row-label">Обед</td>
              <td data-day="1" data-time="день"></td><td data-day="2" data-time="день"></td><td data-day="3" data-time="день"></td><td data-day="4" data-time="день"></td><td data-day="5" data-time="день"></td><td data-day="6" data-time="день"></td><td data-day="7" data-time="день"></td></tr>
            <tr><td class="row-label">Вечер</td>
              <td data-day="1" data-time="вечер"></td><td data-day="2" data-time="вечер"></td><td data-day="3" data-time="вечер"></td><td data-day="4" data-time="вечер"></td><td data-day="5" data-time="вечер"></td><td data-day="6" data-time="вечер"></td><td data-day="7" data-time="вечер"></td></tr>
          </tbody>
        </table>
      </div>

      <h2>Сегодня — отметить приём</h2>
      <div id="сегодня-приёмы"></div>

      <h2>Мои лекарства</h2>
      <div id="список-лекарств"></div>
    </main>
  </div>

  <!-- ================= ЭКРАН 4: ФОРМА ЛЕКАРСТВА ================= -->
  <div id="screen-med-form" class="screen">
    <header>
      <button class="back" onclick="перейти('screen-tracker')">‹ Назад</button>
      <h1>Новое лекарство</h1>
      <button class="save" onclick="сохранитьЛекарство()">Готово</button>
    </header>

    <main>
      <input id="название-л" placeholder="Название лекарства">
      <input id="дозировка-л" placeholder="Дозировка (например 100 мг)">

      <label class="section-title">Когда принимать и во сколько</label>

      <div class="time-row">
        <label class="time-toggle">
          <input type="checkbox" id="вкл-утро" value="утро" checked>
          <span>🌅 Утро</span>
        </label>
        <input type="time" id="время-утро" value="08:00">
      </div>

      <div class="time-row">
        <label class="time-toggle">
          <input type="checkbox" id="вкл-день" value="день">
          <span>☀️ Обед</span>
        </label>
        <input type="time" id="время-день" value="14:00">
      </div>

      <div class="time-row">
        <label class="time-toggle">
          <input type="checkbox" id="вкл-вечер" value="вечер">
          <span>🌙 Вечер</span>
        </label>
        <input type="time" id="время-вечер" value="20:00">
      </div>

      <label class="section-title">Дни недели</label>
      <div class="chips" id="дни-недели">
        <label><input type="checkbox" value="1" checked> Пн</label>
        <label><input type="checkbox" value="2" checked> Вт</label>
        <label><input type="checkbox" value="3" checked> Ср</label>
        <label><input type="checkbox" value="4" checked> Чт</label>
        <label><input type="checkbox" value="5" checked> Пт</label>
        <label><input type="checkbox" value="6" checked> Сб</label>
        <label><input type="checkbox" value="7" checked> Вс</label>
      </div>

      <label class="section-title">Курс</label>
      <input type="number" id="дней-курса" value="7" min="1" max="365">
      <input type="date" id="дата-начала">
      <p id="конец-курса" class="muted"></p>
    </main>
  </div>

  <!-- ================= ЭКРАН 5: СТАТИСТИКА ================= -->
  <div id="screen-stats" class="screen">
    <header>
      <h1>Статистика</h1>
      <button onclick="экспортPDF()">📤 Экспорт</button>
    </header>

    <main>
      <div class="circle-wrap">
        <svg viewBox="0 0 200 200" class="circle">
          <circle cx="100" cy="100" r="85" stroke="#e5e5ea" stroke-width="14" fill="none"/>
          <circle id="прогресс" cx="100" cy="100" r="85" stroke="#34c759" stroke-width="14" fill="none"
                  stroke-dasharray="534" stroke-dashoffset="534"
                  stroke-linecap="round" transform="rotate(-90 100 100)"/>
        </svg>
        <div class="circle-text">
          <strong id="процент">0%</strong>
          <span>приверженность</span>
        </div>
      </div>

      <div id="список-статистики"></div>
    </main>
  </div>

  <!-- ================= НИЖНЕЕ МЕНЮ ================= -->
  <nav class="tabbar">
    <button class="tab active" data-screen="screen-home"><span>🏠</span>Главная</button>
    <button class="tab" data-screen="screen-stats"><span>📊</span>Статистика</button>
    <button class="tab" data-screen="screen-tracker"><span>💊</span>Трекер</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
